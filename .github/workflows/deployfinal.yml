name: CI/CD Pipeline - liz morocho (Build & Publish)

on:
  push:
    branches: "morocho"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest test_app.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set repository name
      id: repo
      run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.repo.outputs.name }}:1.0.5
          ghcr.io/${{ steps.repo.outputs.name }}:latest
    
    - name: ✅ Build Success
      run: |
        echo " CI/CD Pipeline completado exitosamente!"
        echo " Imagen publicada: ghcr.io/${{ steps.repo.outputs.name }}:1.0.5"
        echo " Para despliegue manual, usar: docker stack deploy -c stack.yml morocho-stack"
        echo " Aplicación disponible en: https://morocho.byronrm.com"